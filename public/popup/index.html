<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xTranslator</title>
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <main class="popup-shell" aria-labelledby="popup-title">
      <header class="popup-header">
        <div class="brand-lockup" aria-label="xTranslator">
          <img class="brand-mark" src="../icons/icon-48.png" alt="" width="32" height="32" />
          <span id="popup-title"><span class="brand-x">x</span>Translator</span>
        </div>
        <button id="open-options" class="icon-button" type="button" data-i18n-aria-label="popup.openSettings" data-i18n-title="popup.openSettings">
          <i data-lucide="settings" aria-hidden="true"></i>
        </button>
      </header>
      <section id="locale-panel" class="config-panel" aria-live="polite" data-state="ready">
        <p class="eyebrow" data-i18n="popup.translationLanguage">Translation language</p>
        <p id="locale-detail" class="config-detail" data-i18n="popup.followBrowserLanguage">Follow browser language</p>
      </section>
      <section id="config-panel" class="config-panel" aria-live="polite" data-state="idle">
        <p class="eyebrow" data-i18n="popup.translationEngine">Translation engine</p>
        <p id="config-detail" class="config-detail" data-i18n="popup.loading">Loading…</p>
      </section>
      <section id="translation-panel" class="translation-panel" aria-live="polite" data-state="idle">
        <p class="eyebrow" data-i18n="popup.watchStatus">Viewing status</p>
        <p id="translation-video-title" class="translation-title" data-i18n="popup.readyToTranslate">Ready to translate</p>
        <p id="translation-detail" class="translation-detail" data-i18n="popup.openYoutubeVideo">Open a YouTube video and click the xTranslator button in the player.</p>
      </section>
      <p id="popup-status" class="status-message" role="status"></p>
    </main>
    <script src="./index.js"></script>
  </body>
</html>
