<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xTranslator</title>
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <main class="popup-shell" aria-labelledby="popup-title">
      <header class="popup-header">
        <div class="brand-lockup" aria-label="xTranslator">
          <img class="brand-mark" src="../icons/icon-48.png" alt="" width="32" height="32" />
          <span id="popup-title"><span class="brand-x">x</span>Translator</span>
        </div>
        <button id="open-options" class="icon-button" type="button" aria-label="打开设置" title="打开设置">
          <i data-lucide="settings" aria-hidden="true"></i>
        </button>
      </header>
      <section id="locale-panel" class="config-panel" aria-live="polite" data-state="ready">
        <p class="eyebrow">翻译语言</p>
        <p id="locale-detail" class="config-detail">自动跟随浏览器语言</p>
      </section>
      <section id="config-panel" class="config-panel" aria-live="polite" data-state="idle">
        <p class="eyebrow">翻译引擎</p>
        <p id="config-detail" class="config-detail">加载中…</p>
      </section>
      <section id="translation-panel" class="translation-panel" aria-live="polite" data-state="idle">
        <p class="eyebrow">观看状态</p>
        <p id="translation-video-title" class="translation-title">准备好开始翻译</p>
        <p id="translation-detail" class="translation-detail">打开 YouTube 视频，点击播放器中的 xTranslator 按钮。</p>
      </section>
      <p id="popup-status" class="status-message" role="status"></p>
    </main>
    <script src="./index.js"></script>
  </body>
</html>
